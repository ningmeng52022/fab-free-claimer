<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Fab 免费素材领取器</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="extName">Fab 免费素材领取器</h1>
      <span id="badge" class="badge idle" data-i18n="badgeIdle">空闲</span>
    </header>

    <section class="account">
      <div class="row">
        <span class="label" data-i18n="accountLabel">账号</span>
        <span id="account" data-i18n="notSignedIn">未登录</span>
      </div>
      <div class="row">
        <span class="label" data-i18n="listingsLabel">已发现</span>
        <span id="listings">0</span>
      </div>
      <div class="row">
        <span class="label" data-i18n="claimedLabel">已领取</span>
        <span id="claimed">0</span>
      </div>
      <div class="row">
        <span class="label" data-i18n="failedLabel">失败</span>
        <span id="failed">0</span>
      </div>
      <div class="row">
        <span class="label" data-i18n="runLabel">本次运行</span>
        <span id="run">-</span>
      </div>
    </section>

    <progress id="bar" value="0" max="1"></progress>
    <p id="hint" class="hint" data-i18n="hintIdle">选择范围后点击「开始」。</p>

    <section class="controls">
      <label class="field">
        <span data-i18n="scopeLabel">范围</span>
        <select id="mode">
          <option value="all" data-i18n="scopeAll">全部免费素材</option>
          <option value="free" data-i18n="scopeFree">全部免费类型（不含 Quixel）</option>
          <option value="quixel" data-i18n="scopeQuixel">仅 Quixel</option>
        </select>
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="incremental" />
        <span data-i18n="incrementalLabel">增量模式（只领新上架）</span>
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="reconcile" checked />
        <span data-i18n="reconcileLabel">结束时复查失败项</span>
      </label>
    </section>

    <section class="buttons">
      <button id="start" class="primary" data-i18n="startBtn">开始</button>
      <button id="pause" disabled data-i18n="pauseBtn">暂停</button>
      <button id="stop" disabled data-i18n="stopBtn">停止</button>
    </section>

    <section class="buttons secondary">
      <button id="verify" class="ghost" data-i18n="verifyBtn">抽查 30 条</button>
      <button id="reset" class="ghost danger" data-i18n="resetBtn">清空数据</button>
    </section>

    <details id="diag" class="diag">
      <summary data-i18n="diagTitle">诊断信息</summary>
      <pre id="diagBody" class="log"></pre>
      <button id="copyDiag" class="ghost" data-i18n="copyDiagBtn">复制诊断信息</button>
    </details>

    <pre id="log" class="log"></pre>

    <script type="module" src="popup.js"></script>
  </body>
</html>
